# Cursor
cursor_trail 1
cursor_shape block
cursor_shape_unfocused hollow

# Clipboard
copy_on_select        clipboard
paste_actions         quote-urls-at-prompt,confirm
strip_trailing_spaces smart

# Window
scrollback_lines 65535
enable_audio_bell no
background_opacity 0.90
background_blur 1

# Font
font_family family="IosevkaTerm Nerd Font"
font_size 12.0

# Dropdown terminal configuration
hide_window_decorations yes

# Colorscheme (Railscasts - matching tmux)
# background            #2b2b2b
background            #020403
foreground            #e6e1dc
cursor                #ffffff
selection_background  #5a647e
selection_foreground  #e6e1dc

# Standard colors
color0                #2b2b2b
color8                #5a647e
color1                #da4939
color9                #da4939
color2                #a5c261
color10               #a5c261
color3                #ffc66d
color11               #ffc66d
color4                #6d9cbe
color12               #6d9cbe
color5                #b6b3eb
color13               #b6b3eb
color6                #519f50
color14               #519f50
color7                #e6e1dc
color15               #f9f7f3


#===============================================================================
# tmux-like keybindings and behavior
# Based on ~/.tmux/tmux_3.4.conf
#===============================================================================

# Use ctrl+a as the modifier (like tmux prefix)
# Note: kitty_mod can't be set to just ctrl+a, so we use ctrl+shift
# and map ctrl+a combinations explicitly
kitty_mod ctrl+shift

# Allow remote control (needed for some features)
allow_remote_control yes
listen_on unix:/tmp/kitty-$KITTY_PID

# No input delay (like tmux escape-time 0)
repaint_delay 0
input_delay 0

# Shell integration
# shell_integration enabled
shell_integration no-cursor


#-------------------------------------------------------------------------------
# Layouts and Splits (ctrl+shift)
#-------------------------------------------------------------------------------

# Enable layouts (like tmux panes)
enabled_layouts splits,stack,tall,fat,grid,horizontal,vertical

# Pane borders (matching tmux: yellow active, grey inactive)
# active_border_color   #ffc66d
active_border_color   #c4a000
inactive_border_color #585858

# Splits
map ctrl+shift+!       launch --location=vsplit --cwd=current
map ctrl+shift+minus   launch --location=hsplit --cwd=current

# New tab with current directory (like tmux new-window)
map ctrl+shift+t       new_tab_with_cwd


#-------------------------------------------------------------------------------
# Pane Navigation (shift+arrow and alt+hjkl)
#-------------------------------------------------------------------------------

# Shift+Arrow to move between panes (like tmux)
map shift+left     neighboring_window left
map shift+right    neighboring_window right
map shift+up       neighboring_window up
map shift+down     neighboring_window down

# Ctrl+hjkl to move between panes (vim-aware via pass_keys kitten)
# When in vim/nvim, keys are passed through for smart-splits.nvim to handle
# Otherwise, kitty's neighboring_window is used
map ctrl+h         kitten ~/.config/kitty/pass_keys.py left   ctrl+h
map ctrl+j         kitten ~/.config/kitty/pass_keys.py bottom ctrl+j
map ctrl+k         kitten ~/.config/kitty/pass_keys.py top    ctrl+k
map ctrl+l         kitten ~/.config/kitty/pass_keys.py right  ctrl+l


#-------------------------------------------------------------------------------
# Tab/Window Navigation (alt+arrows, alt+number)
#-------------------------------------------------------------------------------

# Tab navigation
map ctrl+shift+n   next_tab
map ctrl+shift+p   previous_tab
map alt+right      next_tab
map alt+left       previous_tab

# Go to specific tab
map alt+1          goto_tab 1
map alt+2          goto_tab 2
map alt+3          goto_tab 3
map alt+4          goto_tab 4
map alt+5          goto_tab 5
map alt+6          goto_tab 6
map alt+7          goto_tab 7
map alt+8          goto_tab 8
map alt+9          goto_tab 9

# Swap panes
map ctrl+shift+.   move_window_forward
map ctrl+shift+,   move_window_backward


#-------------------------------------------------------------------------------
# Pane/Window Management (ctrl+shift)
#-------------------------------------------------------------------------------

# Kill pane
map ctrl+shift+w   close_window

# Kill tab
map ctrl+shift+q   close_tab

# Zoom/unzoom pane (toggle stack layout)
map ctrl+shift+z   toggle_layout stack

# Resize panes
map ctrl+shift+left    resize_window narrower
map ctrl+shift+right   resize_window wider
map ctrl+shift+up      resize_window taller
map ctrl+shift+down    resize_window shorter
map ctrl+shift+r       resize_window reset


#-------------------------------------------------------------------------------
# Copy Mode / Scrollback
#-------------------------------------------------------------------------------

# Enter scrollback/copy mode
map ctrl+shift+:   show_scrollback

# Scroll with shift+pageup/down (like tmux)
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down

# Scrollback pager using less with vi keys
# For nvim: scrollback_pager nvim -c "set nonumber norelativenumber" -c "autocmd TermOpen * normal G" -
scrollback_pager less +G -R


#-------------------------------------------------------------------------------
# Mouse
#-------------------------------------------------------------------------------

# Middle click to paste (like tmux)
mouse_map middle release ungrabbed paste_from_clipboard
mouse_map middle press grabbed discard_event

# Right click to extend selection
mouse_map right press ungrabbed mouse_selection extend


#-------------------------------------------------------------------------------
# Reload Config
#-------------------------------------------------------------------------------

map ctrl+shift+r  load_config_file


#-------------------------------------------------------------------------------
# Tab Bar (partial status bar replacement)
#-------------------------------------------------------------------------------

tab_bar_edge bottom
tab_bar_style custom
# tab_powerline_style slanted
tab_bar_min_tabs 1
tab_activity_symbol "!"

# Show tab index (like tmux window numbers starting at 1)
tab_title_template "{index}: {title}"
active_tab_title_template "{index}: {title}"

# Tab colors (Railscasts theme - matching tmux status bar)
# active_tab_foreground #c4a000
active_tab_foreground   #d75f00
active_tab_background #262626
active_tab_font_style   bold

# inactive_tab_foreground   #d75f00
inactive_tab_foreground #c4a000
inactive_tab_background #262626
inactive_tab_font_style normal
tab_bar_background      #262626


#-------------------------------------------------------------------------------
# Misc
#-------------------------------------------------------------------------------

# Toggle tab bar
map ctrl+shift+b   toggle_tab_bar

# Font size
map ctrl+shift+=     increase_font_size
map ctrl+shift+;     decrease_font_size

# Clear screen and scrollback
map ctrl+shift+delete clear_terminal scrollback active

# Session management - kitty has limited support via startup sessions
# To use: kitty --session ~/.config/kitty/session.conf
